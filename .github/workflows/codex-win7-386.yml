name: Codex Win7 386 Build

on:
  push:
    branches:
      - codex/build-win7-386
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"

      - name: Prepare legacy go.mod
        shell: pwsh
        run: |
          (Get-Content go.mod) |
            Where-Object { $_ -notmatch '^toolchain\s+' } |
            ForEach-Object { $_ -replace '^go\s+.*$', 'go 1.20' } |
            Set-Content go.mod

      - name: Build Windows 7 SP1 386 binary
        shell: pwsh
        run: |
          $env:GOOS="windows"
          $env:GOARCH="386"
          $env:CGO_ENABLED="0"
          go build -trimpath -ldflags "-s -w" -o "serial-server-v1.2.19-windows-win7-386.exe" ./cmd/serial-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-server-v1.2.19-windows-win7-386.exe
          path: serial-server-v1.2.19-windows-win7-386.exe
