name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: windows-latest
            goos: windows
            goarch: 386
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"

      - name: Build
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $env:GOOS="${{ matrix.goos }}"
          $env:GOARCH="${{ matrix.goarch }}"
          $env:CGO_ENABLED="0"
          $version = "${{ github.ref_name }}"
          go build -trimpath -ldflags "-s -w" -o "serial-server-$version-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/serial-server

      - name: Build (Linux)
        if: runner.os != 'Windows'
        run: |
          version="${{ github.ref_name }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "serial-server-$version-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/serial-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-server-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: serial-server-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  build-windows-legacy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go 1.21 起不再支持 Windows 7 / Server 2008 R2。
      # 这里保留一个 Win7 SP1 专用构建，正常 Windows 版本仍使用主构建矩阵。
      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"

      - name: Prepare legacy go.mod
        shell: pwsh
        run: |
          (Get-Content go.mod) |
            Where-Object { $_ -notmatch '^toolchain\s+' } |
            ForEach-Object { $_ -replace '^go\s+.*$', 'go 1.20' } |
            Set-Content go.mod

      - name: Build Windows 7 SP1 legacy binary
        shell: pwsh
        run: |
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          $env:CGO_ENABLED="0"
          $version = "${{ github.ref_name }}"
          go build -trimpath -ldflags "-s -w" -o "serial-server-$version-windows-win7-amd64.exe" ./cmd/serial-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-server-${{ github.ref_name }}-windows-win7-amd64.exe
          path: serial-server-${{ github.ref_name }}-windows-win7-amd64.exe

  release:
    needs:
      - build
      - build-windows-legacy
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
